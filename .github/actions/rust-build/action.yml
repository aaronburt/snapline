name: Rust build setup
description: Install the toolchain, restore the Rust and FFmpeg caches, build the UI and fetch FFmpeg

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
        targets: x86_64-pc-windows-msvc
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: ui/package-lock.json
    - name: Install UI dependencies
      shell: bash
      working-directory: ui
      run: npm ci
    - name: Build UI
      shell: bash
      working-directory: ui
      run: npm run build
    - name: Cache FFmpeg
      id: ffmpeg
      uses: actions/cache@v6
      with:
        path: third_party/ffmpeg
        key: ffmpeg-${{ hashFiles('xtask/ffmpeg.lock') }}
    - name: Fetch FFmpeg
      if: steps.ffmpeg.outputs.cache-hit != 'true'
      shell: bash
      run: cargo xtask fetch-ffmpeg
