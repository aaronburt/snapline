name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'snapline-main' || format('snapline-pr-{0}', github.run_id) }}
  queue: max

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Build UI
        working-directory: ui
        run: npm run build
      - name: Cache FFmpeg
        uses: actions/cache@v6
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('xtask/ffmpeg.lock') }}
      - name: Fetch FFmpeg
        run: cargo xtask fetch-ffmpeg
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace -- --skip crash::tests::panic_child_process
      - uses: taiki-e/install-action@cargo-deny
      - name: Cargo deny
        run: cargo deny check
      - name: UI tests
        working-directory: ui
        run: npm test
      - name: UI check
        working-directory: ui
        run: npm run check

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/prepare-release.ps1
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.tag != ''
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.tag != ''
      - uses: actions/setup-node@v7
        if: steps.version.outputs.tag != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Restore FFmpeg
        if: steps.version.outputs.tag != ''
        uses: actions/cache/restore@v6
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('xtask/ffmpeg.lock') }}
      - name: Package Windows release
        if: steps.version.outputs.tag != ''
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo xtask fetch-ffmpeg
          cargo xtask package
      - name: Publish GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RESUME_DRAFT: ${{ steps.version.outputs.resume_draft }}
          MARK_LATEST: ${{ steps.version.outputs.mark_latest }}
        run: ./.github/scripts/publish-release.ps1
