name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels that PR's older runs. A run that is already
# executing on main is never cancelled because it can publish a release.
concurrency:
  group: ${{ github.event_name == 'push' && 'snapline-main' || format('snapline-pr-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - uses: taiki-e/install-action@cargo-deny
      - name: Cargo deny
        run: cargo deny check

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build
      - name: Test
        run: cargo test --workspace -- --skip crash::tests::panic_child_process

  ui-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build
      - name: Build app
        run: cargo build -p snapline
      - name: Drive the UI and screenshot every stage
        shell: pwsh
        run: ./tests/ui-e2e/run.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-e2e-screenshots
          path: target/ui-e2e/
          if-no-files-found: warn
          retention-days: 14

  # PR builds are never shipped, so they skip LTO and use more codegen units.
  # They use their own Rust cache ('fast'); this job keeps it warm from main.
  warm-fast-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build
        with:
          cache-key: fast
      - name: Build the fast release profile
        run: cargo build --release -p snapline

  package:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      resume_draft: ${{ steps.version.outputs.resume_draft }}
      mark_latest: ${{ steps.version.outputs.mark_latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}
          persist-credentials: false
      - uses: ./.github/actions/rust-build
        with:
          cache-key: ${{ github.event_name == 'pull_request' && 'fast' || '' }}
      # Set after the cache restore so it does not change the cache key.
      - name: Skip LTO on PR builds
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo 'CARGO_PROFILE_RELEASE_LTO=off' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16' >> "$GITHUB_ENV"
      # Runs after the cache restore so the stamped Cargo.toml does not change the cache key.
      - name: Select release version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/prepare-release.ps1
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Package Windows build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo xtask package
      - uses: actions/upload-artifact@v4
        with:
          name: snapline-windows
          path: |
            target/release/snapline.exe
            target/release/bundle/nsis/*-setup.exe
            target/portable/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted && needs.package.outputs.tag != ''
    needs: [lint, clippy, test, package]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: snapline-windows
          path: target
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
          RESUME_DRAFT: ${{ needs.package.outputs.resume_draft }}
          MARK_LATEST: ${{ needs.package.outputs.mark_latest }}
        run: ./.github/scripts/publish-release.ps1
