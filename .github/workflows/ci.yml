name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'snapline-main' || format('snapline-pr-{0}', github.run_id) }}
  queue: max

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - uses: taiki-e/install-action@cargo-deny
      - name: Cargo deny
        run: cargo deny check

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build
      - name: Test
        run: cargo test --workspace -- --skip crash::tests::panic_child_process

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Package Windows build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo xtask package
      - uses: actions/upload-artifact@v4
        with:
          name: snapline-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/portable/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted
    needs: [lint, clippy, test, package]
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/prepare-release.ps1
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.tag != ''
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.tag != ''
      - name: Install NSIS
        if: steps.version.outputs.tag != ''
        run: choco install nsis --no-progress -y
      - name: Restore FFmpeg
        if: steps.version.outputs.tag != ''
        uses: actions/cache/restore@v6
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('xtask/ffmpeg.lock') }}
      - name: Package Windows release
        if: steps.version.outputs.tag != ''
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo xtask fetch-ffmpeg
          cargo xtask package
      - name: Publish GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RESUME_DRAFT: ${{ steps.version.outputs.resume_draft }}
          MARK_LATEST: ${{ steps.version.outputs.mark_latest }}
        run: ./.github/scripts/publish-release.ps1
