<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
<title id="t">Snapline memory use by release</title>
<desc id="d">Private working set per release. Version 0.27: tray idle 6.3 MB, main window open 11.0 MB.</desc>
<style>
svg{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e6e5e1;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
.bg{fill:var(--bg)}.ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.grid{stroke:var(--grid);stroke-width:1}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{stroke:var(--bg);stroke-width:2}
</style>
<rect class="bg" width="800" height="380" rx="8"/>
<text class="ink" x="56" y="28" font-size="16" font-weight="600">Memory use by release</text>
<text class="ink2" x="56" y="47" font-size="12">Private working set in MB, measured in CI on a Windows runner</text>
<line class="grid" x1="56" y1="324.0" x2="610" y2="324.0"/>
<text class="ink2" x="48" y="328.0" font-size="11" text-anchor="end">0</text>
<line class="grid" x1="56" y1="259.0" x2="610" y2="259.0"/>
<text class="ink2" x="48" y="263.0" font-size="11" text-anchor="end">5</text>
<line class="grid" x1="56" y1="194.0" x2="610" y2="194.0"/>
<text class="ink2" x="48" y="198.0" font-size="11" text-anchor="end">10</text>
<line class="grid" x1="56" y1="129.0" x2="610" y2="129.0"/>
<text class="ink2" x="48" y="133.0" font-size="11" text-anchor="end">15</text>
<line class="grid" x1="56" y1="64.0" x2="610" y2="64.0"/>
<text class="ink2" x="48" y="68.0" font-size="11" text-anchor="end">20</text>
<text class="ink2" x="333.0" y="344" font-size="11" text-anchor="middle">0.27</text>
<circle class="dot" cx="333.0" cy="241.8" r="4.5" style="fill:var(--s1)"><title>Tray idle, 0.27: 6.3 MB</title></circle>
<text class="ink" x="343.0" y="245.8" font-size="12">6.3 MB</text>
<rect x="634" y="63" width="10" height="10" rx="2" style="fill:var(--s1)"/>
<text class="ink2" x="650" y="72" font-size="11">Tray idle</text>
<circle class="dot" cx="333.0" cy="181.4" r="4.5" style="fill:var(--s2)"><title>Main window open, 0.27: 11.0 MB</title></circle>
<text class="ink" x="343.0" y="185.4" font-size="12">11.0 MB</text>
<rect x="634" y="83" width="10" height="10" rx="2" style="fill:var(--s2)"/>
<text class="ink2" x="650" y="92" font-size="11">Main window open</text>
<rect x="634" y="103" width="10" height="10" rx="2" style="fill:var(--s3)"/>
<text class="ink2" x="650" y="112" font-size="11">Capture overlay open</text>
