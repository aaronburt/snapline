<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snapline settings v2: General</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.hv{cursor:pointer}
.hv:hover{box-shadow:inset 0 0 0 999px var(--subtle)}
button,input,select{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.tg{appearance:none;-webkit-appearance:none;width:40px;height:20px;border-radius:10px;border:1px solid var(--text3);background:transparent;position:relative;margin:0;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--text2);transition:left .15s}
.tg:checked{background:var(--accent);border-color:var(--accent)}
.tg:checked::after{left:23px;background:var(--onAccent)}
</style>
</helmet>
<div style="{{vars}}; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: var(--mica); font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, sans-serif; color: var(--text); font-size: 13px">

  <!-- Title bar -->
  <div style="height: 40px; display: flex; align-items: center; gap: 12px; padding-left: 16px; flex: none">
    <svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true" style="flex: none"><rect width="32" height="32" rx="8" fill="var(--accent)"></rect><path d="M9 13V9h4M19 9h4v4M23 19v4h-4M13 23H9v-4" fill="none" stroke="var(--onAccent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="font-size: 12px; flex: 1">Snapline Settings</span>
    <div style="display: flex; flex: none">
      <button class="hv" aria-label="Minimise" style="width: 46px; height: 40px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"></path></svg></button>
      <button class="hv" aria-label="Maximise" style="width: 46px; height: 40px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1"></rect></svg></button>
      <a href="App-v2.dc.html" class="hv" aria-label="Close" style="width: 46px; height: 40px; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"></path></svg></a>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap; align-items: flex-start">
    <!-- Settings navigation -->
    <nav aria-label="Settings" style="flex: 1 1 240px; max-width: 100%; padding: 8px 12px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
      <a href="App-v2.dc.html" class="hv" style="height: 36px; border-radius: 4px; display: flex; align-items: center; gap: 10px; padding: 0 10px; color: var(--text2); align-self: flex-start">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
        Back to Snapline
      </a>
      <label style="margin: 8px 0 12px; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--card); border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); border-radius: 4px; color: var(--text3)">
        <input type="search" aria-label="Find a setting" placeholder="Find a setting" style="flex: 1; min-width: 0; border: none; background: transparent; color: var(--text); font-size: 13px; outline: none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
      </label>
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="{{n.href}}" class="hv" aria-current="{{n.current}}" style="{{n.bg}}; position: relative; height: 40px; border-radius: 4px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; color: var(--text)">
          <sc-if value="{{n.active}}" hint-placeholder-val="{{false}}">
            <span aria-hidden="true" style="position: absolute; left: 4px; top: 12px; width: 3px; height: 16px; border-radius: 2px; background: var(--accent)"></span>
          </sc-if>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
          {{n.label}}
        </a>
      </sc-for>
    </nav>

    <!-- Settings content -->
    <main style="flex: 999 1 560px; min-width: 0; height: calc(100vh - 40px); overflow-y: auto; background: var(--layer); border: 1px solid var(--stroke); border-right: none; border-bottom: none; border-top-left-radius: 8px; padding: 28px 40px 48px; box-sizing: border-box">
      <div style="max-width: 1000px; display: flex; flex-direction: column; gap: 28px">
        <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">General</h1>

        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 20px; background: var(--card); border: 1px solid var(--stroke); border-radius: 6px">
          <svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true" style="flex: none"><rect width="32" height="32" rx="8" fill="var(--accent)"></rect><path d="M9 13V9h4M19 9h4v4M23 19v4h-4M13 23H9v-4" fill="none" stroke="var(--onAccent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="16" cy="16" r="2.4" fill="var(--onAccent)"></circle></svg>
          <div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 16px; font-weight: 600">Snapline</div>
            <div style="font-size: 12px; color: var(--text3)">Version 0.1.0 · You're up to date</div>
          </div>
          <button class="hv" style="height: 34px; padding: 0 14px; border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); background: var(--layer); color: var(--text); border-radius: 4px; font-size: 13px">Check for updates</button>
        </div>

        <sc-for list="{{sections}}" as="sec" hint-placeholder-count="5">
          <section aria-label="{{sec.title}}" style="display: flex; flex-direction: column; gap: 4px">
            <h2 style="margin: 0 0 4px; font-size: 14px; font-weight: 600">{{sec.title}}</h2>
            <sc-if value="{{sec.desc}}" hint-placeholder-val="{{false}}">
              <p style="margin: 0 0 6px; font-size: 12px; color: var(--text3)">{{sec.desc}}</p>
            </sc-if>

            <sc-if value="{{sec.steps}}" hint-placeholder-val="{{false}}">
              <div style="background: var(--card); border: 1px solid var(--stroke); border-radius: 6px; overflow: hidden; margin-bottom: 4px">
                <sc-for list="{{sec.steps}}" as="st" hint-placeholder-count="5">
                  <div style="{{st.border}}; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px 0 6px">
                    <button aria-label="Reorder: {{st.label}}" style="width: 28px; height: 40px; border: none; background: transparent; color: var(--text3); cursor: grab; display: flex; align-items: center; justify-content: center; border-radius: 4px; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button>
                    <span style="width: 18px; font-size: 12px; color: var(--text3); text-align: right; flex: none">{{st.n}}</span>
                    <label style="flex: 1 1 200px; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 12px; padding-left: 8px; cursor: pointer">
                      <input type="checkbox" checked="{{st.on}}" onChange="{{st.flip}}" style="width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex: none">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{st.d}}"></path></svg>
                      <span style="{{st.labelStyle}}; font-size: 13px">{{st.label}}</span>
                    </label>
                    <span style="font-size: 12px; color: var(--text3); white-space: nowrap">{{st.note}}</span>
                  </div>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{sec.naming}}" hint-placeholder-val="{{false}}">
              <div style="padding: 16px 20px; background: var(--card); border: 1px solid var(--stroke); border-radius: 6px; display: flex; flex-direction: column; gap: 12px">
                <label style="display: flex; flex-direction: column; gap: 6px">
                  <span style="font-size: 13px">Name pattern</span>
                  <input type="text" value="{{naming.pattern}}" onChange="{{naming.change}}" spellcheck="false" style="height: 34px; padding: 0 10px; border: 1px solid var(--stroke); border-bottom: 2px solid var(--accent); border-radius: 4px; background: var(--layer); color: var(--text); font-size: 13px; font-family: 'Cascadia Code', Consolas, ui-monospace, monospace">
                </label>
                <div style="display: flex; flex-wrap: wrap; gap: 6px" aria-label="Insert a token">
                  <sc-for list="{{naming.tokens}}" as="tk" hint-placeholder-count="10">
                    <button class="hv" onClick="{{tk.add}}" title="{{tk.hint}}" style="height: 28px; padding: 0 10px; border: 1px solid var(--stroke); background: var(--layer); color: var(--text2); border-radius: 14px; font-size: 12px; font-family: 'Cascadia Code', Consolas, ui-monospace, monospace">{{tk.t}}</button>
                  </sc-for>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; padding: 10px 12px; background: var(--subtle); border-radius: 4px; font-size: 12px">
                  <span style="color: var(--text3)">Preview</span>
                  <span style="color: var(--text); word-break: break-all; font-family: 'Cascadia Code', Consolas, ui-monospace, monospace">{{naming.preview}}</span>
                </div>
              </div>
            </sc-if>

            <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="3">
              <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{true}}">
                <label class="hv" style="min-height: 68px; padding: 12px 20px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--stroke); border-radius: 6px">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{r.d}}"></path></svg>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                    <span style="font-size: 14px">{{r.title}}</span>
                    <span style="font-size: 12px; color: var(--text3)">{{r.desc}}</span>
                  </span>
                  <span style="font-size: 13px; color: var(--text2); width: 24px; text-align: right">{{r.onLabel}}</span>
                  <input type="checkbox" class="tg" checked="{{r.on}}" onChange="{{r.flip}}">
                </label>
              </sc-if>
              <sc-if value="{{r.isOther}}" hint-placeholder-val="{{false}}">
                <div style="min-height: 68px; padding: 12px 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; background: var(--card); border: 1px solid var(--stroke); border-radius: 6px">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{r.d}}"></path></svg>
                  <div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                    <span id="{{r.labelId}}" style="font-size: 14px">{{r.title}}</span>
                    <span style="font-size: 12px; color: var(--text3)">{{r.desc}}</span>
                  </div>
                  <sc-if value="{{r.isSelect}}" hint-placeholder-val="{{false}}">
                    <select aria-labelledby="{{r.labelId}}" value="{{r.value}}" onChange="{{r.change}}" style="height: 34px; min-width: 220px; padding: 0 10px; border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); border-radius: 4px; background: var(--layer); color: var(--text); font-size: 13px">
                      <sc-for list="{{r.options}}" as="o" hint-placeholder-count="3">
                        <option value="{{o}}">{{o}}</option>
                      </sc-for>
                    </select>
                  </sc-if>
                  <sc-if value="{{r.isSeg}}" hint-placeholder-val="{{false}}">
                    <div role="radiogroup" aria-labelledby="{{r.labelId}}" style="display: flex; padding: 2px; background: var(--subtle); border: 1px solid var(--stroke); border-radius: 6px">
                      <sc-for list="{{r.segs}}" as="sg" hint-placeholder-count="4">
                        <button role="radio" aria-checked="{{sg.checked}}" onClick="{{sg.pick}}" style="{{sg.style}}; height: 30px; min-width: 52px; padding: 0 12px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer">{{sg.label}}</button>
                      </sc-for>
                    </div>
                  </sc-if>
                  <sc-if value="{{r.isField}}" hint-placeholder-val="{{false}}">
                    <div style="display: flex; gap: 6px; flex: 1 1 320px; max-width: 460px">
                      <input type="text" aria-labelledby="{{r.labelId}}" value="{{r.value}}" onChange="{{r.change}}" spellcheck="false" style="{{r.font}}; flex: 1; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); border-radius: 4px; background: var(--layer); color: var(--text); font-size: 12px">
                      <sc-if value="{{r.btn}}" hint-placeholder-val="{{false}}">
                        <button class="hv" style="height: 34px; padding: 0 12px; border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); background: var(--layer); color: var(--text); border-radius: 4px; font-size: 13px; flex: none">{{r.btn}}</button>
                      </sc-if>
                    </div>
                  </sc-if>
                  <sc-if value="{{r.isRange}}" hint-placeholder-val="{{false}}">
                    <div style="display: flex; align-items: center; gap: 12px">
                      <input type="range" min="{{r.min}}" max="{{r.max}}" aria-labelledby="{{r.labelId}}" value="{{r.value}}" onChange="{{r.change}}" style="width: 200px; accent-color: var(--accent)">
                      <span style="width: 44px; text-align: right; font-size: 13px; color: var(--text2)">{{r.shown}}</span>
                    </div>
                  </sc-if>
                </div>
              </sc-if>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { vals: {}, steps: {}, pattern: '{app}_{yyyy}-{MM}-{dd}_{HH}-{mm}-{ss}' };
  }
  tokens(dark) {
    return dark ? {
      mica: '#1c1c1c', layer: '#272727', card: '#2d2d2d',
      stroke: 'rgba(255,255,255,0.08)', strokeHi: 'rgba(255,255,255,0.16)',
      text: '#ffffff', text2: '#d0d0d0', text3: '#a8a8a8',
      accent: '#60cdff', onAccent: '#002a40', subtle: 'rgba(255,255,255,0.06)', shadow: 'rgba(0,0,0,0.5)'
    } : {
      mica: '#eeeeee', layer: '#f9f9f9', card: '#ffffff',
      stroke: 'rgba(0,0,0,0.09)', strokeHi: 'rgba(0,0,0,0.18)',
      text: '#1a1a1a', text2: '#3b3b3b', text3: '#5f5f5f',
      accent: '#005fb8', onAccent: '#ffffff', subtle: 'rgba(0,0,0,0.045)', shadow: 'rgba(0,0,0,0.18)'
    };
  }
  setVal(id, v) { this.setState({ vals: { ...this.state.vals, [id]: v } }); }
  row(r) {
    const has = Object.prototype.hasOwnProperty.call(this.state.vals, r.id);
    const v = has ? this.state.vals[r.id] : r.value;
    const k = r.kind;
    const out = { ...r, desc: r.desc || '', labelId: 'lbl-' + r.id, isToggle: k === 'toggle', isOther: k !== 'toggle', isSelect: k === 'select', isSeg: k === 'seg', isField: k === 'field', isRange: k === 'range', btn: r.btn || '' };
    if (k === 'toggle') { out.on = !!v; out.onLabel = v ? 'On' : 'Off'; out.flip = () => this.setVal(r.id, !v); }
    if (k === 'select' || k === 'field') { out.value = v; out.change = (e) => this.setVal(r.id, e.target.value); }
    if (k === 'field') out.font = r.mono ? "font-family: 'Cascadia Code', Consolas, ui-monospace, monospace" : 'font-family: inherit';
    if (k === 'range') { out.value = v; out.shown = v + (r.unit || ''); out.change = (e) => this.setVal(r.id, Number(e.target.value)); }
    if (k === 'seg') out.segs = r.options.map((o) => ({
      label: o, checked: o === v ? 'true' : 'false',
      style: o === v ? 'background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px var(--shadow)' : 'background: transparent; color: var(--text2)',
      pick: () => this.setVal(r.id, o)
    }));
    return out;
  }
  steps(list) {
    return list.map((s, i) => {
      const has = Object.prototype.hasOwnProperty.call(this.state.steps, s.id);
      const on = has ? this.state.steps[s.id] : s.on;
      return {
        ...s, n: i + 1, on, note: s.note || '',
        border: i === 0 ? 'border-top: none' : 'border-top: 1px solid var(--stroke)',
        labelStyle: on ? 'color: var(--text)' : 'color: var(--text3)',
        flip: () => this.setState({ steps: { ...this.state.steps, [s.id]: !on } })
      };
    });
  }
  renderVals() {
    const dark = this.props.dark ?? true;
    const t = this.tokens(dark);
    const vars = Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';') + ';color-scheme:' + (dark ? 'dark' : 'light');
    const I = {
      power: 'M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0',
      tray: 'M4 13h4l2 3h4l2-3h4M4 13l2-8h12l2 8v6H4z',
      bell: 'M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0',
      redo: 'M20 7v5h-5M20 12a8 8 0 1 1-2.3-5.7L20 9',
      folder: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
      tree: 'M4 4v14a2 2 0 0 0 2 2h4M4 10h6M14 7h6v6h-6zM14 15h6v6h-6z',
      image: 'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15 9h.01',
      gauge: 'M12 14l4-4M4 18a9 9 0 1 1 16 0',
      copy: 'M9 9h11v11H9zM5 15H4V4h11v1',
      edit: 'M4 20h4L19 9l-4-4L4 16zM13 7l4 4',
      upload: 'M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4',
      ocr: 'M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M9 9h6M12 9v7',
      pin: 'M9 4h6l-1 6 3 3H7l3-3zM12 13v8',
      link: 'M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1',
      short: 'M4 12h10M10 8l4 4-4 4M18 6v12',
      open: 'M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',
      qr: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM18 14h2M14 18h2',
      speaker: 'M4 9h4l5-4v14l-5-4H4zM17 9a4 4 0 0 1 0 6',
      code: 'M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12h2M3 12h2M12 3v2M12 19v2M17 7l1.4-1.4M5.6 18.4L7 17M17 17l1.4 1.4M5.6 5.6L7 7',
      region: 'M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M9 9h6v6H9z',
      cloud: 'M7 18a4 4 0 0 1-.5-7.97A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z'
    };
    const R = (r) => this.row(r);
    const sections = [
      { title: 'Startup', rows: [
        { id: 'launch', kind: 'toggle', value: true, d: I.power, title: 'Launch at sign-in', desc: 'Start Snapline in the tray when you sign in to Windows' },
        { id: 'min', kind: 'toggle', value: true, d: I.tray, title: 'Start minimised to tray', desc: "Don't open the main window on launch" },
        { id: 'toast', kind: 'toggle', value: true, d: I.bell, title: 'Notifications', desc: 'Show a toast when an upload finishes or a link is copied' },
        { id: 'upd', kind: 'toggle', value: true, d: I.redo, title: 'Check for updates automatically', desc: 'Checks once a week in the background' }
      ].map(R) },
      { title: 'Saving', rows: [
        { id: 'folder', kind: 'field', mono: true, btn: 'Browse…', value: '%USERPROFILE%\\Pictures\\Snapline', d: I.folder, title: 'Save captures to', desc: 'Captures are kept on this PC even after they are uploaded' },
        { id: 'sub', kind: 'select', value: 'By month (2026-11)', options: ['By month (2026-11)', 'By day (2026-11-08)', 'By app (chrome)', 'No subfolders'], d: I.tree, title: 'Subfolders', desc: 'Organise saved files automatically' },
        { id: 'fmt', kind: 'seg', value: 'PNG', options: ['PNG', 'JPEG', 'WebP', 'AVIF'], d: I.image, title: 'Image format', desc: 'PNG is lossless; the others are smaller' },
        { id: 'q', kind: 'range', value: 90, min: 40, max: 100, unit: '%', d: I.gauge, title: 'Lossy quality', desc: 'Used for JPEG, WebP and AVIF' }
      ].map(R) },
      { title: 'File naming', desc: 'Click a token to add it. Tokens are filled in at the moment of capture.', naming: true, rows: [] },
      { title: 'Default workflow · PrtSc', desc: 'What happens after a capture. Each hotkey can run its own workflow — this is the one PrtSc and the tray use.', steps: this.steps([
        { id: 'copy', on: true, d: I.copy, label: 'Copy image to clipboard' },
        { id: 'edit', on: false, d: I.edit, label: 'Open in editor to annotate' },
        { id: 'save', on: true, d: I.folder, label: 'Save to folder' },
        { id: 'upload', on: true, d: I.upload, label: 'Upload to default destination', note: 'Imgur' },
        { id: 'link', on: true, d: I.link, label: 'Copy link to clipboard' },
        { id: 'sound', on: true, d: I.speaker, label: 'Play a sound' }
      ]), rows: [
        { id: 'linkfmt', kind: 'select', value: 'Direct link', options: ['Direct link', 'Markdown', 'HTML <img>', 'BBCode', 'Page link'], d: I.code, title: 'Copied link format', desc: 'What gets pasted when you press Ctrl+V' },
        { id: 'flows', kind: 'select', value: '5 workflows', options: ['5 workflows'], d: I.gear, title: 'Other workflows', desc: 'Per-hotkey workflows are edited in the app under Workflows' }
      ].map(R) }
    ].map((s) => ({ ...s, desc: s.desc || '', steps: s.steps || false, naming: !!s.naming }));

    const pattern = this.state.pattern;
    const sample = { app: 'chrome', window: 'Pull-request-42', yyyy: '2026', MM: '11', dd: '08', HH: '14', mm: '31', ss: '07', rand: 'k3f9', n: '0042', w: '1280', h: '720' };
    const fmtHas = Object.prototype.hasOwnProperty.call(this.state.vals, 'fmt');
    const ext = (fmtHas ? this.state.vals.fmt : 'PNG').toLowerCase().replace('jpeg', 'jpg');
    const preview = pattern.replace(/\{(\w+)\}/g, (m, k) => (sample[k] !== undefined ? sample[k] : m)) + '.' + ext;
    const hints = { app: 'Process name', window: 'Window title', yyyy: 'Year', MM: 'Month', dd: 'Day', HH: 'Hour', mm: 'Minute', ss: 'Second', rand: 'Random characters', n: 'Counter', w: 'Width', h: 'Height' };
    const naming = {
      pattern, preview,
      change: (e) => this.setState({ pattern: e.target.value }),
      tokens: Object.keys(sample).map((k) => ({ t: '{' + k + '}', hint: hints[k], add: () => this.setState({ pattern: this.state.pattern + '{' + k + '}' }) }))
    };

    const navDefs = [
      { label: 'General', href: 'Settings-General-v2.dc.html', d: I.gear, active: true },
      { label: 'Capture', href: 'Settings-Capture-v2.dc.html', d: I.region },
      { label: 'Hotkeys', href: 'Settings-Hotkeys-v2.dc.html', d: 'M3 6h18v12H3zM7 10h.01M11 10h.01M15 10h.01M7 14h10' },
      { label: 'Upload destinations', href: 'Settings-Uploads-v2.dc.html', d: I.cloud }
    ];
    const nav = navDefs.map((n) => ({ ...n, active: !!n.active, current: n.active ? 'page' : undefined, bg: n.active ? 'background: var(--subtle)' : 'background: transparent' }));
    return { vars, nav, sections, naming };
  }
}
