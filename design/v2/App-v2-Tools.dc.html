<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snapline v2 Tools</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 100vh">
<dc-import name="App-v2" view="tools" dark="{{dark}}" hint-size="100%,880px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":1280,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    return { dark: this.props.dark ?? true };
  }
}
</script>
</body>
</html>
