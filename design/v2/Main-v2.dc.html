<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snapline tray quick panel v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.hv{cursor:pointer}
.hv:hover{box-shadow:inset 0 0 0 999px var(--subtle)}
button,a,input{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:1px}
</style>
</helmet>
<div style="{{vars}}; width: 1280px; height: 800px; position: relative; overflow: hidden; background: var(--wall); font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, sans-serif; color: var(--text); font-size: 13px">
  <div aria-hidden="true" style="position: absolute; left: -180px; top: -260px; width: 900px; height: 900px; border-radius: 50%; background: var(--wall2)"></div>
  <div aria-hidden="true" style="position: absolute; left: 520px; top: 260px; width: 700px; height: 700px; border-radius: 50%; background: var(--wall2); opacity: 0.55"></div>

  <!-- Quick panel flyout -->
  <section aria-label="Snapline quick panel" style="position: absolute; right: 12px; bottom: 60px; width: 344px; background: var(--layer); border: 1px solid var(--stroke); border-radius: 8px; box-shadow: 0 16px 40px var(--shadow); overflow: hidden; display: flex; flex-direction: column">

    <header style="display: flex; align-items: center; gap: 12px; padding: 14px 12px 12px 16px">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true" style="flex: none"><rect width="32" height="32" rx="8" fill="var(--accent)"></rect><path d="M9 13V9h4M19 9h4v4M23 19v4h-4M13 23H9v-4" fill="none" stroke="var(--onAccent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="16" cy="16" r="2.4" fill="var(--onAccent)"></circle></svg>
      <div style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600">Snapline</div>
      <a href="App-v2.dc.html" class="hv" aria-label="Open Snapline" style="width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></a>
      <a href="Settings-General-v2.dc.html" class="hv" aria-label="Settings" style="width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a>
    </header>

    <div style="padding: 0 12px 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{captures}}" as="c" hint-placeholder-count="4">
        <button class="hv" title="{{c.label}} ({{c.key}})" style="{{c.tile}}; height: 56px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; cursor: pointer; font-size: 12px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg>
          <span style="font-weight: 500; white-space: nowrap">{{c.label}}</span>
        </button>
      </sc-for>
    </div>

    <div style="padding: 10px 16px 12px; border-top: 1px solid var(--stroke); display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-size: 12px; color: var(--text3); font-weight: 500">Recent</div>
        <a href="App-v2.dc.html" style="font-size: 12px; color: var(--accent); padding: 4px 0">View all</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{recents}}" as="r" hint-placeholder-count="3">
          <button class="hv" aria-label="{{r.name}}" style="background: transparent; border: none; padding: 0; color: inherit; text-align: left; display: flex; flex-direction: column; gap: 5px; cursor: pointer; border-radius: 4px">
            <div style="position: relative; width: 100%; aspect-ratio: 16 / 10; background: {{r.p.bg}}; border-radius: 4px; overflow: hidden; border: 1px solid var(--stroke); box-sizing: border-box">
              <div style="position: absolute; left: 8%; top: 12%; width: 84%; height: 88%; background: {{r.p.win}}; border-radius: 3px 3px 0 0"></div>
              <div style="position: absolute; left: 8%; top: 12%; width: 84%; height: 8%; background: {{r.p.bar}}; border-radius: 3px 3px 0 0"></div>
              <div style="position: absolute; left: 12%; top: 26%; width: 18%; height: 70%; background: {{r.p.side}}"></div>
              <div style="position: absolute; left: 34%; top: 27%; width: 36%; height: 7%; background: {{r.p.a}}; border-radius: 1px"></div>
              <div style="position: absolute; left: 34%; top: 39%; width: 54%; height: 26%; background: {{r.p.b}}; border-radius: 1px"></div>
              <div style="position: absolute; left: 34%; top: 71%; width: 50%; height: 5%; background: {{r.p.line}}"></div>
              <div style="position: absolute; left: 34%; top: 81%; width: 40%; height: 5%; background: {{r.p.line}}"></div>
              <sc-if value="{{r.video}}" hint-placeholder-val="{{false}}">
                <span style="position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,0.72); color: #fff; font-size: 10px; padding: 1px 4px; border-radius: 3px">{{r.dur}}</span>
              </sc-if>
            </div>
            <div style="display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text3)">
              <sc-if value="{{r.uploaded}}" hint-placeholder-val="{{true}}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Uploaded" role="img"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>
              </sc-if>
              {{r.time}}
            </div>
          </button>
        </sc-for>
      </div>
    </div>

    <footer style="padding: 8px 8px 8px 16px; background: var(--mica); border-top: 1px solid var(--stroke); display: flex; align-items: center; gap: 8px">
      <span style="font-size: 12px; color: var(--text3); flex: none">Last link</span>
      <span style="flex: 1; min-width: 0; font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Cascadia Code', Consolas, ui-monospace, monospace">i.imgur.com/kq7Ra2P.png</span>
      <button class="hv" style="height: 32px; padding: 0 10px; border: 1px solid var(--stroke); background: var(--card); color: var(--text); border-radius: 4px; display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h11v11H9zM5 15H4V4h11v1"></path></svg>Copy</button>
    </footer>
  </section>

  <!-- Taskbar -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: var(--taskbar); border-top: 1px solid var(--stroke); display: flex; align-items: center; padding: 0 8px 0 12px; box-sizing: border-box">
    <div style="flex: 1"></div>
    <div aria-hidden="true" style="display: flex; align-items: center; gap: 6px">
      <div style="width: 40px; height: 40px; border-radius: 4px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="1" y="1" width="8.4" height="8.4" rx="1" fill="var(--accent)"></rect><rect x="10.6" y="1" width="8.4" height="8.4" rx="1" fill="var(--accent)"></rect><rect x="1" y="10.6" width="8.4" height="8.4" rx="1" fill="var(--accent)"></rect><rect x="10.6" y="10.6" width="8.4" height="8.4" rx="1" fill="var(--accent)"></rect></svg></div>
      <div style="width: 180px; height: 32px; border-radius: 16px; background: var(--subtle); border: 1px solid var(--stroke); display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box; color: var(--text3); font-size: 12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>Search</div>
      <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><div style="width: 24px; height: 24px; border-radius: 6px; background: #3b7fc4"></div></div>
      <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><div style="width: 24px; height: 24px; border-radius: 6px; background: #d9953a"></div></div>
      <div style="width: 40px; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 4px; background: var(--subtle)"><div style="width: 24px; height: 24px; border-radius: 6px; background: #4c9a6a"></div></div>
      <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><div style="width: 24px; height: 24px; border-radius: 6px; background: #8a6bc4"></div></div>
    </div>
    <div style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 2px">
      <div aria-hidden="true" style="width: 32px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--text2)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg></div>
      <button aria-label="Snapline" aria-expanded="true" style="position: relative; width: 36px; height: 40px; border: none; border-radius: 4px; background: var(--subtle); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"></rect><path d="M9 13V9h4M19 9h4v4M23 19v4h-4M13 23H9v-4" fill="none" stroke="var(--onAccent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span aria-hidden="true" style="position: absolute; left: 12px; right: 12px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--accent)"></span>
      </button>
      <div aria-hidden="true" style="height: 40px; padding: 0 8px; display: flex; align-items: center; gap: 10px; color: var(--text)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0M12 19.5h.01"></path></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4zM17 9a4 4 0 0 1 0 6"></path></svg>
        <svg width="18" height="16" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2" y="6" width="21" height="12" rx="2"></rect><path d="M25 10v4"></path><rect x="5" y="9" width="12" height="6" rx="1" fill="currentColor" stroke="none"></rect></svg>
      </div>
      <div aria-hidden="true" style="height: 40px; padding: 0 8px; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; font-size: 12px; line-height: 16px">
        <span>14:32</span>
        <span>08/11/2026</span>
      </div>
      <div aria-hidden="true" style="width: 32px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--text)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"></path></svg></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { after: { copy: true, edit: false, save: true, upload: true } };
  }
  tokens(dark) {
    return dark ? {
      bg: '#202020', mica: '#1c1c1c', layer: '#272727', card: '#2d2d2d', cardAlt: '#343434',
      stroke: 'rgba(255,255,255,0.08)', strokeHi: 'rgba(255,255,255,0.16)',
      text: '#ffffff', text2: '#d0d0d0', text3: '#a8a8a8',
      accent: '#60cdff', onAccent: '#002a40', accentSoft: 'rgba(96,205,255,0.15)',
      subtle: 'rgba(255,255,255,0.06)', ok: '#6ccb5f', okSoft: 'rgba(108,203,95,0.15)',
      err: '#ff99a4', errSoft: 'rgba(255,153,164,0.14)',
      wall: '#14232e', wall2: '#1a2f3d', taskbar: 'rgba(28,28,28,0.95)', shadow: 'rgba(0,0,0,0.5)'
    } : {
      bg: '#f3f3f3', mica: '#eeeeee', layer: '#f9f9f9', card: '#ffffff', cardAlt: '#f5f5f5',
      stroke: 'rgba(0,0,0,0.09)', strokeHi: 'rgba(0,0,0,0.18)',
      text: '#1a1a1a', text2: '#3b3b3b', text3: '#5f5f5f',
      accent: '#005fb8', onAccent: '#ffffff', accentSoft: 'rgba(0,95,184,0.10)',
      subtle: 'rgba(0,0,0,0.045)', ok: '#0f7b0f', okSoft: 'rgba(15,123,15,0.10)',
      err: '#c42b1c', errSoft: 'rgba(196,43,28,0.10)',
      wall: '#c9d7e3', wall2: '#b9cbda', taskbar: 'rgba(243,243,243,0.95)', shadow: 'rgba(0,0,0,0.18)'
    };
  }
  renderVals() {
    const dark = this.props.dark ?? true;
    const t = this.tokens(dark);
    const vars = Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';') + ';color-scheme:' + (dark ? 'dark' : 'light');
    const caps = [
      { label: 'Region', key: 'PrtSc', d: 'M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M9 9h6v6H9z' },
      { label: 'Window', key: 'Alt+PrtSc', d: 'M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 9h18' },
      { label: 'Screen', key: 'Ctrl+PrtSc', d: 'M3 5h18v11H3zM8 20h8M12 16v4' },
      { label: 'Scrolling', key: 'Ctrl+Alt+S', d: 'M7 3h10v18H7zM12 8v7M9 12l3 3 3-3' },
      { label: 'Record', key: 'Shift+PrtSc', d: 'M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' },
      { label: 'GIF', key: 'Ctrl+Shift+G', d: 'M4 4h16v16H4zM8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4' },
      { label: 'Text (OCR)', key: 'Ctrl+Shift+T', d: 'M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M9 9h6M12 9v7' },
      { label: 'Color', key: 'Ctrl+Shift+C', d: 'M16 3l5 5-2.5 2.5-5-5zM13.5 5.5L5 14v5h5l8.5-8.5' }
    ];
    const captures = caps.slice(0, 4).map((c, i) => ({
      ...c,
      tile: i === 0
        ? 'background: var(--accent); color: var(--onAccent); border: 1px solid var(--accent)'
        : 'background: var(--card); color: var(--text); border: 1px solid var(--stroke)',
      keyStyle: i === 0 ? 'color: var(--onAccent); opacity: 0.85' : 'color: var(--text3)'
    }));
    const a = this.state.after;
    const chipDefs = [
      { id: 'copy', label: 'Copy image', d: 'M9 9h11v11H9zM5 15H4V4h11v1' },
      { id: 'edit', label: 'Annotate', d: 'M4 20h4L19 9l-4-4L4 16zM13 7l4 4' },
      { id: 'save', label: 'Save', d: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' },
      { id: 'upload', label: 'Upload', d: 'M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4' }
    ];
    const chips = chipDefs.map((c) => {
      const on = !!a[c.id];
      return {
        ...c,
        d: on ? 'M5 12l5 5 9-10' : c.d,
        pressed: on ? 'true' : 'false',
        style: on
          ? 'background: var(--accentSoft); color: var(--accent); border: 1px solid var(--accent)'
          : 'background: transparent; color: var(--text2); border: 1px solid var(--strokeHi)',
        toggle: () => this.setState({ after: { ...this.state.after, [c.id]: !on } })
      };
    });
    const P = [
      { bg: '#2c4a66', win: '#f4f6f8', bar: '#dfe5ea', side: '#e6ebf0', a: '#3a6ea5', b: '#c9d9ea', line: '#cfd6dd' },
      { bg: '#3d3550', win: '#1e1e24', bar: '#2c2c34', side: '#26262e', a: '#c586c0', b: '#2f3d4f', line: '#4e5a68' },
      { bg: '#2f5a4e', win: '#fbfaf7', bar: '#e9e5dc', side: '#efece5', a: '#2f7a5e', b: '#dfe9e2', line: '#d8d3c8' }
    ];
    const recents = [
      { name: 'Region capture, 2 minutes ago', time: '2 min ago', uploaded: true, video: false, p: P[0] },
      { name: 'Screen recording, 18 minutes ago', time: '18 min ago', uploaded: true, video: true, dur: '0:42', p: P[1] },
      { name: 'Window capture, 1 hour ago', time: '1 h ago', uploaded: false, video: false, p: P[2] }
    ];
    return { vars, captures, chips, recents };
  }
}
</script>
</body>
</html>
