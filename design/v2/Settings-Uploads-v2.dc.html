<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snapline settings v2: Upload destinations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.hv{cursor:pointer}
.hv:hover{box-shadow:inset 0 0 0 999px var(--subtle)}
button,input,select{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.tg{appearance:none;-webkit-appearance:none;width:40px;height:20px;border-radius:10px;border:1px solid var(--text3);background:transparent;position:relative;margin:0;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--text2);transition:left .15s}
.tg:checked{background:var(--accent);border-color:var(--accent)}
.tg:checked::after{left:23px;background:var(--onAccent)}
</style>
</helmet>
<div style="{{vars}}; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: var(--mica); font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, sans-serif; color: var(--text); font-size: 13px">

  <!-- Title bar -->
  <div style="height: 40px; display: flex; align-items: center; gap: 12px; padding-left: 16px; flex: none">
    <svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true" style="flex: none"><rect width="32" height="32" rx="8" fill="var(--accent)"></rect><path d="M9 13V9h4M19 9h4v4M23 19v4h-4M13 23H9v-4" fill="none" stroke="var(--onAccent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="font-size: 12px; flex: 1">Snapline Settings</span>
    <div style="display: flex; flex: none">
      <button class="hv" aria-label="Minimise" style="width: 46px; height: 40px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"></path></svg></button>
      <button class="hv" aria-label="Maximise" style="width: 46px; height: 40px; border: none; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1"></rect></svg></button>
      <a href="App-v2.dc.html" class="hv" aria-label="Close" style="width: 46px; height: 40px; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"></path></svg></a>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap; align-items: flex-start">
    <!-- Settings navigation -->
    <nav aria-label="Settings" style="flex: 1 1 240px; max-width: 100%; padding: 8px 12px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
      <a href="App-v2.dc.html" class="hv" style="height: 36px; border-radius: 4px; display: flex; align-items: center; gap: 10px; padding: 0 10px; color: var(--text2); align-self: flex-start">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
        Back to Snapline
      </a>
      <label style="margin: 8px 0 12px; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--card); border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); border-radius: 4px; color: var(--text3)">
        <input type="search" aria-label="Find a setting" placeholder="Find a setting" style="flex: 1; min-width: 0; border: none; background: transparent; color: var(--text); font-size: 13px; outline: none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
      </label>
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
        <a href="{{n.href}}" class="hv" aria-current="{{n.current}}" style="{{n.bg}}; position: relative; height: 40px; border-radius: 4px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; color: var(--text)">
          <sc-if value="{{n.active}}" hint-placeholder-val="{{false}}">
            <span aria-hidden="true" style="position: absolute; left: 4px; top: 12px; width: 3px; height: 16px; border-radius: 2px; background: var(--accent)"></span>
          </sc-if>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
          {{n.label}}
        </a>
      </sc-for>
    </nav>

    <!-- Settings content -->
    <main style="flex: 999 1 560px; min-width: 0; height: calc(100vh - 40px); overflow-y: auto; background: var(--layer); border: 1px solid var(--stroke); border-right: none; border-bottom: none; border-top-left-radius: 8px; padding: 28px 40px 48px; box-sizing: border-box">
      <div style="max-width: 1000px; display: flex; flex-direction: column; gap: 28px">
        <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Upload destinations</h1>

        <sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
          <section aria-label="{{sec.title}}" style="display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px">
              <h2 style="margin: 0; font-size: 14px; font-weight: 600">{{sec.title}}</h2>
              <sc-if value="{{sec.accounts}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-wrap: wrap; gap: 6px">
                  <button class="hv" style="height: 32px; padding: 0 12px; border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); background: var(--card); color: var(--text); border-radius: 4px; display: flex; align-items: center; gap: 8px; font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"></path></svg>Import ShareX uploader (.sxcu)</button>
                  <button style="height: 32px; padding: 0 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--onAccent); border-radius: 4px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add destination</button>
                </div>
              </sc-if>
            </div>
            <sc-if value="{{sec.desc}}" hint-placeholder-val="{{false}}">
              <p style="margin: 0 0 6px; font-size: 12px; color: var(--text3)">{{sec.desc}}</p>
            </sc-if>

            <sc-if value="{{sec.accounts}}" hint-placeholder-val="{{false}}">
              <div style="background: var(--card); border: 1px solid var(--stroke); border-radius: 6px; overflow: hidden">
                <sc-for list="{{accounts}}" as="ac" hint-placeholder-count="5">
                  <div style="{{ac.border}}; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; min-height: 64px; padding: 10px 20px; box-sizing: border-box">
                    <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 8px; background: var(--subtle); border: 1px solid var(--stroke); display: flex; align-items: center; justify-content: center; flex: none; color: var(--text2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ac.d}}"></path></svg></span>
                    <div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                      <span style="font-size: 14px">{{ac.name}}</span>
                      <span style="font-size: 12px; color: var(--text3)">{{ac.detail}}</span>
                    </div>
                    <span style="{{ac.badge}}; display: flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 12px; font-size: 12px"><span aria-hidden="true" style="{{ac.dot}}; width: 6px; height: 6px; border-radius: 50%"></span>{{ac.status}}</span>
                    <button class="hv" style="height: 32px; min-width: 96px; padding: 0 12px; border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); background: var(--layer); color: var(--text); border-radius: 4px; font-size: 13px">{{ac.action}}</button>
                  </div>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{sec.uploader}}" hint-placeholder-val="{{false}}">
              <div style="padding: 20px; background: var(--card); border: 1px solid var(--stroke); border-radius: 6px; display: flex; flex-direction: column; gap: 18px">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 16px">
                  <sc-for list="{{up.fields}}" as="fd" hint-placeholder-count="6">
                    <label style="{{fd.span}}; display: flex; flex-direction: column; gap: 6px; min-width: 0">
                      <span style="font-size: 12px; color: var(--text2)">{{fd.label}}</span>
                      <sc-if value="{{fd.isSelect}}" hint-placeholder-val="{{false}}">
                        <select value="{{fd.value}}" onChange="{{fd.change}}" style="height: 34px; padding: 0 10px; border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); border-radius: 4px; background: var(--layer); color: var(--text); font-size: 13px">
                          <sc-for list="{{fd.options}}" as="o" hint-placeholder-count="2">
                            <option value="{{o}}">{{o}}</option>
                          </sc-for>
                        </select>
                      </sc-if>
                      <sc-if value="{{fd.isText}}" hint-placeholder-val="{{true}}">
                        <input type="text" value="{{fd.value}}" onChange="{{fd.change}}" spellcheck="false" style="{{fd.font}}; height: 34px; padding: 0 10px; border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); border-radius: 4px; background: var(--layer); color: var(--text); font-size: 12px; min-width: 0">
                      </sc-if>
                    </label>
                  </sc-for>
                </div>

                <div style="display: flex; flex-direction: column; gap: 6px">
                  <span style="font-size: 12px; color: var(--text2)">Headers</span>
                  <div style="display: flex; flex-wrap: wrap; gap: 6px">
                    <input type="text" aria-label="Header name" value="Authorization" readonly="" style="flex: 1 1 160px; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--stroke); border-radius: 4px; background: var(--layer); color: var(--text); font-size: 12px; font-family: 'Cascadia Code', Consolas, ui-monospace, monospace">
                    <input type="{{up.secretType}}" aria-label="Header value" value="Bearer [YOUR-API-TOKEN]" readonly="" style="flex: 3 1 260px; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--stroke); border-radius: 4px; background: var(--layer); color: var(--text); font-size: 12px; font-family: 'Cascadia Code', Consolas, ui-monospace, monospace">
                    <button class="hv" onClick="{{up.toggleSecret}}" aria-label="{{up.secretLabel}}" aria-pressed="{{up.secretPressed}}" style="width: 34px; height: 34px; border: 1px solid var(--stroke); background: var(--layer); color: var(--text2); border-radius: 4px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg></button>
                  </div>
                  <button class="hv" style="align-self: flex-start; height: 30px; padding: 0 8px; border: none; background: transparent; color: var(--accent); border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 6px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add header</button>
                </div>

                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px solid var(--stroke)">
                  <button onClick="{{up.runTest}}" style="height: 34px; padding: 0 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--onAccent); border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path></svg>Test upload</button>
                  <button class="hv" style="height: 34px; padding: 0 14px; border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); background: var(--layer); color: var(--text); border-radius: 4px; font-size: 13px">Save</button>
                  <button class="hv" style="height: 34px; padding: 0 14px; border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); background: var(--layer); color: var(--text); border-radius: 4px; font-size: 13px">Export .sxcu</button>
                  <div style="flex: 1"></div>
                  <span role="status" style="{{up.testStyle}}; font-size: 12px; display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 12px">{{up.testText}}</span>
                </div>
              </div>
            </sc-if>

            <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="3">
              <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{true}}">
                <label class="hv" style="min-height: 68px; padding: 12px 20px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--stroke); border-radius: 6px">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{r.d}}"></path></svg>
                  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                    <span style="font-size: 14px">{{r.title}}</span>
                    <span style="font-size: 12px; color: var(--text3)">{{r.desc}}</span>
                  </span>
                  <span style="font-size: 13px; color: var(--text2); width: 24px; text-align: right">{{r.onLabel}}</span>
                  <input type="checkbox" class="tg" checked="{{r.on}}" onChange="{{r.flip}}">
                </label>
              </sc-if>
              <sc-if value="{{r.isOther}}" hint-placeholder-val="{{false}}">
                <div style="min-height: 68px; padding: 12px 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; background: var(--card); border: 1px solid var(--stroke); border-radius: 6px">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{r.d}}"></path></svg>
                  <div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                    <span id="{{r.labelId}}" style="font-size: 14px">{{r.title}}</span>
                    <span style="font-size: 12px; color: var(--text3)">{{r.desc}}</span>
                  </div>
                  <sc-if value="{{r.isSelect}}" hint-placeholder-val="{{false}}">
                    <select aria-labelledby="{{r.labelId}}" value="{{r.value}}" onChange="{{r.change}}" style="height: 34px; min-width: 220px; padding: 0 10px; border: 1px solid var(--stroke); border-bottom-color: var(--strokeHi); border-radius: 4px; background: var(--layer); color: var(--text); font-size: 13px">
                      <sc-for list="{{r.options}}" as="o" hint-placeholder-count="3">
                        <option value="{{o}}">{{o}}</option>
                      </sc-for>
                    </select>
                  </sc-if>
                  <sc-if value="{{r.isSeg}}" hint-placeholder-val="{{false}}">
                    <div role="radiogroup" aria-labelledby="{{r.labelId}}" style="display: flex; padding: 2px; background: var(--subtle); border: 1px solid var(--stroke); border-radius: 6px">
                      <sc-for list="{{r.segs}}" as="sg" hint-placeholder-count="3">
                        <button role="radio" aria-checked="{{sg.checked}}" onClick="{{sg.pick}}" style="{{sg.style}}; height: 30px; min-width: 52px; padding: 0 12px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer">{{sg.label}}</button>
                      </sc-for>
                    </div>
                  </sc-if>
                </div>
              </sc-if>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { vals: {}, showSecret: false, test: 'idle' };
  }
  tokens(dark) {
    return dark ? {
      mica: '#1c1c1c', layer: '#272727', card: '#2d2d2d',
      stroke: 'rgba(255,255,255,0.08)', strokeHi: 'rgba(255,255,255,0.16)',
      text: '#ffffff', text2: '#d0d0d0', text3: '#a8a8a8',
      accent: '#60cdff', onAccent: '#002a40', subtle: 'rgba(255,255,255,0.06)', shadow: 'rgba(0,0,0,0.5)',
      ok: '#6ccb5f', okSoft: 'rgba(108,203,95,0.15)'
    } : {
      mica: '#eeeeee', layer: '#f9f9f9', card: '#ffffff',
      stroke: 'rgba(0,0,0,0.09)', strokeHi: 'rgba(0,0,0,0.18)',
      text: '#1a1a1a', text2: '#3b3b3b', text3: '#5f5f5f',
      accent: '#005fb8', onAccent: '#ffffff', subtle: 'rgba(0,0,0,0.045)', shadow: 'rgba(0,0,0,0.18)',
      ok: '#0f7b0f', okSoft: 'rgba(15,123,15,0.10)'
    };
  }
  val(id, def) { return Object.prototype.hasOwnProperty.call(this.state.vals, id) ? this.state.vals[id] : def; }
  setVal(id, v) { this.setState({ vals: { ...this.state.vals, [id]: v } }); }
  row(r) {
    const v = this.val(r.id, r.value);
    const k = r.kind;
    const out = { ...r, desc: r.desc || '', labelId: 'lbl-' + r.id, isToggle: k === 'toggle', isOther: k !== 'toggle', isSelect: k === 'select', isSeg: k === 'seg' };
    if (k === 'toggle') { out.on = !!v; out.onLabel = v ? 'On' : 'Off'; out.flip = () => this.setVal(r.id, !v); }
    if (k === 'select') { out.value = v; out.change = (e) => this.setVal(r.id, e.target.value); }
    if (k === 'seg') out.segs = r.options.map((o) => ({
      label: o, checked: o === v ? 'true' : 'false',
      style: o === v ? 'background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px var(--shadow)' : 'background: transparent; color: var(--text2)',
      pick: () => this.setVal(r.id, o)
    }));
    return out;
  }
  renderVals() {
    const dark = this.props.dark ?? true;
    const t = this.tokens(dark);
    const vars = Object.keys(t).map((k) => '--' + k + ':' + t[k]).join(';') + ';color-scheme:' + (dark ? 'dark' : 'light');
    const I = {
      image: 'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15 9h.01',
      film: 'M4 4h16v16H4zM8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4',
      text: 'M5 4h14v16H5zM8 8h8M8 12h8M8 16h5',
      file: 'M14 3H6v18h12V7zM14 3v4h4',
      short: 'M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1',
      cloud: 'M7 18a4 4 0 0 1-.5-7.97A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z',
      bucket: 'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6l2 13c.3 1.2 2.9 2 6 2s5.7-.8 6-2l2-13',
      code: 'M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14',
      server: 'M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01',
      globe: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18',
      shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
      clip: 'M9 4h6v3H9zM9 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-3',
      redo: 'M20 7v5h-5M20 12a8 8 0 1 1-2.3-5.7L20 9',
      timer: 'M12 9v4l2 2M9 2h6M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16z',
      history: 'M12 7v5l3 2M3 12a9 9 0 1 0 2.64-6.36L3 8M3 3v5h5',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12h2M3 12h2M12 3v2M12 19v2M17 7l1.4-1.4M5.6 18.4L7 17M17 17l1.4 1.4M5.6 5.6L7 7',
      region: 'M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M9 9h6v6H9z'
    };
    const R = (r) => this.row(r);
    const sections = [
      { title: 'Default destinations', desc: 'Where each kind of capture goes when “Upload” runs.', rows: [
        { id: 'img', kind: 'select', value: 'Imgur', options: ['Imgur', 'Amazon S3', 'Custom: My server', 'Save locally only'], d: I.image, title: 'Images' },
        { id: 'vid', kind: 'select', value: 'Amazon S3', options: ['Amazon S3', 'Custom: My server', 'Save locally only'], d: I.film, title: 'Videos and GIFs' },
        { id: 'txt', kind: 'select', value: 'GitHub Gist', options: ['GitHub Gist', 'Pastebin', 'Custom: My server', 'Save locally only'], d: I.text, title: 'Text and code' },
        { id: 'oth', kind: 'select', value: 'Custom: My server', options: ['Custom: My server', 'Amazon S3', 'SFTP'], d: I.file, title: 'Other files' },
        { id: 'short', kind: 'select', value: 'None', options: ['None', 'is.gd', 'Custom: My server'], d: I.short, title: 'Link shortener' }
      ].map(R) },
      { title: 'Accounts and uploaders', accounts: true, rows: [] },
      { title: 'Custom uploader · My server', desc: 'Compatible with ShareX .sxcu files. Response values use JSON paths.', uploader: true, rows: [] },
      { title: 'Upload behaviour', rows: [
        { id: 'strip', kind: 'toggle', value: true, d: I.shield, title: 'Remove location and camera data', desc: 'Strip EXIF metadata before anything leaves your PC' },
        { id: 'confirm', kind: 'toggle', value: true, d: I.clip, title: 'Ask before uploading from the clipboard', desc: 'Avoid sending something you copied by mistake' },
        { id: 'retry', kind: 'select', value: '3 times', options: ["Don't retry", 'Once', '3 times', '5 times'], d: I.redo, title: 'Retry failed uploads' },
        { id: 'timeout', kind: 'seg', value: '60 s', options: ['30 s', '60 s', '120 s'], d: I.timer, title: 'Upload timeout' },
        { id: 'hist', kind: 'select', value: 'Forever', options: ['Forever', '1 year', '90 days', '30 days'], d: I.history, title: 'Keep upload history', desc: 'Links and deletion links shown in History' },
        { id: 'proxy', kind: 'select', value: 'Use system proxy', options: ['Use system proxy', 'No proxy', 'Custom proxy…'], d: I.globe, title: 'Proxy' }
      ].map(R) }
    ].map((s) => ({ ...s, desc: s.desc || '', accounts: !!s.accounts, uploader: !!s.uploader }));

    const ST = {
      ok: { badge: 'color: var(--ok); background: var(--okSoft)', dot: 'background: var(--ok)' },
      off: { badge: 'color: var(--text2); background: var(--subtle)', dot: 'background: var(--text3)' }
    };
    const accounts = [
      { name: 'Imgur', detail: 'Image host · anonymous uploads', status: 'Account saved', st: 'ok', action: 'Sign in', d: I.image },
      { name: 'Amazon S3', detail: 'Bucket [BUCKET] · eu-west-2', status: 'Configured', st: 'ok', action: 'Configure', d: I.bucket },
      { name: 'GitHub Gist', detail: 'Text and code snippets', status: 'Not set up', st: 'off', action: 'Connect', d: I.code },
      { name: 'SFTP', detail: 'Your own server over SSH', status: 'Not set up', st: 'off', action: 'Set up', d: I.server },
      { name: 'My server', detail: 'Custom uploader · imported from .sxcu', status: 'Configured', st: 'ok', action: 'Edit', d: I.cloud }
    ].map((a, i) => ({ ...a, badge: ST[a.st].badge, dot: ST[a.st].dot, border: i === 0 ? 'border-top: none' : 'border-top: 1px solid var(--stroke)' }));

    const mono = "font-family: 'Cascadia Code', Consolas, ui-monospace, monospace";
    const F = (f) => {
      const v = this.val('u-' + f.id, f.value);
      return {
        ...f, value: v, isSelect: !!f.options, isText: !f.options, options: f.options || [],
        font: f.mono ? mono : 'font-family: inherit',
        span: f.wide ? 'grid-column: 1 / -1' : 'grid-column: auto',
        change: (e) => this.setVal('u-' + f.id, e.target.value)
      };
    };
    const testing = this.state.test;
    const up = {
      fields: [
        { id: 'name', label: 'Name', value: 'My server' },
        { id: 'method', label: 'Request method', value: 'POST', options: ['POST', 'PUT', 'PATCH'] },
        { id: 'url', label: 'Request URL', value: 'https://[YOUR-SERVER]/api/upload', mono: true, wide: true },
        { id: 'body', label: 'Body', value: 'Multipart form data', options: ['Multipart form data', 'Binary', 'Form URL-encoded', 'JSON'] },
        { id: 'field', label: 'File form field', value: 'file', mono: true },
        { id: 'resUrl', label: 'Link from response', value: '$.data.url', mono: true },
        { id: 'resThumb', label: 'Thumbnail from response', value: '$.data.thumbnail', mono: true },
        { id: 'resDel', label: 'Deletion link from response', value: '$.data.delete_url', mono: true },
        { id: 'resErr', label: 'Error message from response', value: '$.error.message', mono: true }
      ].map(F),
      secretType: this.state.showSecret ? 'text' : 'password',
      secretLabel: this.state.showSecret ? 'Hide header value' : 'Show header value',
      secretPressed: this.state.showSecret ? 'true' : 'false',
      toggleSecret: () => this.setState({ showSecret: !this.state.showSecret }),
      runTest: () => this.setState({ test: 'ok' }),
      testText: testing === 'ok' ? 'Test upload succeeded · link copied' : 'Not tested yet',
      testStyle: testing === 'ok' ? 'color: var(--ok); background: var(--okSoft)' : 'color: var(--text3); background: var(--subtle)'
    };

    const navDefs = [
      { label: 'General', href: 'Settings-General-v2.dc.html', d: I.gear },
      { label: 'Capture', href: 'Settings-Capture-v2.dc.html', d: I.region },
      { label: 'Hotkeys', href: 'Settings-Hotkeys-v2.dc.html', d: 'M3 6h18v12H3zM7 10h.01M11 10h.01M15 10h.01M7 14h10' },
      { label: 'Upload destinations', href: 'Settings-Uploads-v2.dc.html', d: I.cloud, active: true }
    ];
    const nav = navDefs.map((n) => ({ ...n, active: !!n.active, current: n.active ? 'page' : undefined, bg: n.active ? 'background: var(--subtle)' : 'background: transparent' }));
    return { vars, nav, sections, accounts, up };
  }
}
</script>
</body>
</html>
